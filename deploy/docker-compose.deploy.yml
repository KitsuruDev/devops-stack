services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: notes
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    image: ${REGISTRY}/devops/devops-stack/backend:${IMAGE_TAG}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://notes:${DB_PASSWORD}@db:5432/notes
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    image: ${REGISTRY}/devops/devops-stack/frontend:${IMAGE_TAG}
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: notes-nginx   # собран вручную на web-server-1
    depends_on:
      - backend
      - frontend
    ports:
      - "8443:8443"
    restart: unless-stopped

volumes:
  db_data:
