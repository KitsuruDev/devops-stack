# docker-compose.yml
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD not set}
      POSTGRES_DB: notes
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U notes -d notes" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - notes-net

  backend:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://notes:${DB_PASSWORD}@db:5432/notes
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1"
    networks:
      - notes-net

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    networks:
      - notes-net

  nginx:
    image: notes-nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "8443:8443"
    restart: unless-stopped
    networks:
      - notes-net

  adminer:
    image: adminer
    profiles: ["debug"]
    ports:
      - "8081:8080"
    networks:
      - notes-net

volumes:
  db_data:

networks:
  notes-net:
