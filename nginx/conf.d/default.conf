# nginx/conf.d/default.conf
upstream notes_backend {
    server backend:8000;
    keepalive 32;
}

upstream notes_frontend {
    server frontend:80;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name devops-stack.local localhost _;

    # Redirect всех запросов на HTTPS с портом 8443
    # Используем $host (без порта) + явный порт 8443 + $request_uri
    return 301 https://$host:8443$request_uri;
}

server {
    listen 8443 ssl;
    server_name devops-stack.local localhost;

    # TLS: сертификаты из build-слоя (secret mount → /etc/nginx/ssl)
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # SPA: фронтенд отдаёт nginx-frontend
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API: бэкенд
    location /api/ {
        proxy_pass http://notes_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://notes_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Healthcheck для orchestrator / compose
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
